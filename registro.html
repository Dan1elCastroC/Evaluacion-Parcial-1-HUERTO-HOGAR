<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de usuario - HUERTO HOGAR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/estilo.css">
</head>
<body class="body">
    <header class="header">
        <nav class="navbar navbar-expand-lg">
            <div class="container">
                <a class="navbar-brand" href="index.html">
                    <img src="assets/img/huerto hogar.png" alt="Logo Huerto Hogar">
                    HUERTO HOGAR
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav mx-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
                        <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                        <li class="nav-item"><a class="nav-link" href="blogs.html">Blogs</a></li>
                        <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                    </ul>
                    <div class="d-flex align-items-center flex-wrap">
                        <a href="carrito.html" class="nav-carrito ms-3">
                            🛒 Carrito <span class="badge rounded-pill" data-carrito-badge>0</span>
                        </a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="main-content py-5">
        <div class="container" style="max-width: 640px;">
            <form id="form-registro" class="tarjeta-form" novalidate>
                <div class="form-titulo-cabecera">Registro de usuario</div>

                <div class="mb-3">
                    <label for="registro-run" class="form-label">RUN (sin puntos ni guión, ej: 19011022K)</label>
                    <input type="text" class="form-control" id="registro-run" maxlength="9" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="registro-nombre" class="form-label">Nombre completo</label>
                        <input type="text" class="form-control" id="registro-nombre" maxlength="50" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="registro-apellidos" class="form-label">Apellidos</label>
                        <input type="text" class="form-control" id="registro-apellidos" maxlength="100" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="registro-correo" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="registro-correo" maxlength="100" placeholder="usuario@duoc.cl" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="registro-clave" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="registro-clave" minlength="4" maxlength="10" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="registro-confirmar-clave" class="form-label">Confirmar contraseña</label>
                        <input type="password" class="form-control" id="registro-confirmar-clave" minlength="4" maxlength="10" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="registro-telefono" class="form-label">Teléfono (opcional)</label>
                    <input type="tel" class="form-control" id="registro-telefono">
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="registro-region" class="form-label">Región</label>
                        <select class="form-select" id="registro-region" required>
                            <option value="">Seleccione la región</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="registro-comuna" class="form-label">Comuna</label>
                        <select class="form-select" id="registro-comuna" required>
                            <option value="">Seleccione primero una región</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="registro-direccion" class="form-label">Dirección de entrega</label>
                    <input type="text" class="form-control" id="registro-direccion" maxlength="300" required>
                </div>

                <button type="submit" class="btn btn-success w-100">Registrar</button>
                <p class="text-center mt-3 mb-0 small">¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
            </form>
        </div>
    </main>

    <footer class="footer">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
            <p>&copy; 2026 HUERTO HOGAR. Todos los derechos reservados.</p>

                <a href="nosotros.html">Nosotros</a> ·
                <a href="blogs.html">Blogs</a> ·
                <a href="contacto.html">Contacto</a>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/script.js"></script>
</body>
</html>
