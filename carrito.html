    <link rel="stylesheet" href="assets/estilo.css">
</head>
<body class="body">
    <header class="header">
        <nav class="navbar navbar-expand-lg">
            <div class="container">
                <a class="navbar-brand" href="index.html">
                    <img src="assets/img/huerto hogar.png" alt="Logo Huerto Hogar">
                    HUERTO HOGAR
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav mx-auto">

                    </ul>
                    <div class="d-flex align-items-center flex-wrap">

    <main class="main-content py-5">
        <div class="container">
            <h2 class="mb-4">Mi carrito de compras</h2>
            <div class="row">
                <div class="col-lg-8 mb-4">
                    <div id="carrito-items"></div>
                    <button id="btn-vaciar-carrito" class="btn btn-outline-danger btn-sm mt-3">Vaciar carrito</button>
                </div>
                <div class="col-lg-4">
                    <div class="carrito-resumen">
                        <h5>Resumen</h5>
                        <div class="d-flex justify-content-between my-3">
                            <span>Total</span>
                            <span class="fw-bold fs-4" id="carrito-total">$0</span>
                        </div>
                        <button class="btn btn-success w-100">Pagar</button>
                        <a href="productos.html" class="d-block text-center mt-3 small">Seguir comprando</a>
                    </div>
                </div>
            </div>
