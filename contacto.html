<!DOCTYPE html>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/estilo.css">
</head>
<body class="body">
    <header class="header">
        <nav class="navbar navbar-expand-lg">
            <div class="container">
                <a class="navbar-brand" href="index.html">
                    <img src="assets/img/huerto hogar.png" alt="Logo Huerto Hogar">
                    HUERTO HOGAR
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav mx-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
                        <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                        <li class="nav-item"><a class="nav-link" href="blogs.html">Blogs</a></li>
                        <li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li>
                    </ul>
                    <div class="d-flex align-items-center flex-wrap">
                        <div class="nav-auth-links">
                            <a href="login.html">Iniciar sesión</a>
                            <a href="registro.html">Registrarse</a>
                        </div>
                        <a href="carrito.html" class="nav-carrito ms-3">
                            🛒 Carrito <span class="badge rounded-pill" data-carrito-badge>0</span>
                        </a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="main-content py-5">
        <div class="container text-center mb-4">
            <div class="img-placeholder ph-logo mx-auto" style="max-width:200px;">AÑADIR IMG</div>
            <h2 class="mt-3">HuertoHogar</h2>
        </div>
        <div class="container" style="max-width: 560px;">
            <form id="form-contacto" class="tarjeta-form" novalidate>
                <div class="form-titulo-cabecera">Formulario de contacto</div>

                <div class="mb-3">
                    <label for="contacto-nombre" class="form-label">Nombre completo</label>
                    <input type="text" class="form-control" id="contacto-nombre" maxlength="100" required>
                </div>

                <div class="mb-3">
                    <label for="contacto-correo" class="form-label">Correo (opcional)</label>
                    <input type="email" class="form-control" id="contacto-correo" maxlength="100" placeholder="usuario@duoc.cl">
                </div>

                <div class="mb-3">
                    <label for="contacto-comentario" class="form-label">Comentario</label>
                    <textarea class="form-control" id="contacto-comentario" rows="4" maxlength="500" required></textarea>
                </div>

                <button type="submit" class="btn btn-success w-100">Enviar mensaje</button>
            </form>
        </div>
    </main>
