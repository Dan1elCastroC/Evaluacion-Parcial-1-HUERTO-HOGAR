<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - HUERTO HOGAR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/estilo.css">
</head>
<body class="body">
    <header class="header">
        <nav class="navbar navbar-expand-lg">
            <div class="container">
                <a class="navbar-brand" href="index.html">
                    <img src="assets/img/huerto hogar.png" alt="Logo Huerto Hogar">
                    HUERTO HOGAR
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav mx-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
                        <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                        <li class="nav-item"><a class="nav-link" href="blogs.html">Blogs</a></li>
                        <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                    </ul>
                    <div class="d-flex align-items-center flex-wrap">
                        <a href="carrito.html" class="nav-carrito ms-3">
                            🛒 Carrito <span class="badge rounded-pill" data-carrito-badge>0</span>
                        </a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="main-content py-5">
        <div class="container text-center mb-4">
            <div class="img-placeholder ph-logo mx-auto" style="max-width:200px;">AÑADIR IMG</div>
            <h2 class="mt-3">HuertoHogar</h2>
        </div>
        <div class="container" style="max-width: 460px;">
            <form id="form-login" class="tarjeta-form" novalidate>
                <div class="form-titulo-cabecera">Inicio de sesión</div>

                <div class="mb-3">
                    <label for="login-correo" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="login-correo" maxlength="100" placeholder="usuario@duoc.cl" required>
                    <div class="invalid-feedback"></div>
                </div>

                <div class="mb-3">
                    <label for="login-clave" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="login-clave" minlength="4" maxlength="10" required>
                    <div class="invalid-feedback"></div>
                </div>

                <button type="submit" class="btn btn-success w-100">Iniciar sesión</button>
                <p class="text-center mt-3 mb-0 small">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
            </form>

            <div id="login-exito" class="alerta-exito d-none">
                <h5>¡Bienvenido de vuelta!</h5>
                <p class="mb-0">Sesión iniciada correctamente.</p>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
            <p>&copy; 2026 HUERTO HOGAR. Todos los derechos reservados.</p>
            <div>
                <a href="nosotros.html">Nosotros</a> ·
                <a href="blogs.html">Blogs</a> ·
                <a href="contacto.html">Contacto</a>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/script.js"></script>
</body>
</html>
